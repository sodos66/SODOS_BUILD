version: '3.8'

services:
  sodos_app:
    build:
      context: .
      dockerfile: Dockerfile
    image: sodos_app:latest
    container_name: sodos_app
    restart: unless-stopped
    ports:
      - "9530:80"
    networks:
      - data_network

networks:
  data_network:
    external: true
    name: data_network
