# 所有子服务的统一入口
upstream sodos_exchange_app {
    server sodos_runserver:9501;
}

upstream sodos_exchange_ws {
    server ws-gateway:9602;
}

upstream monitioner {
    server 172.20.0.1:17000;
}

upstream sodos_manager_app {
    server sodos_manager:80;
}

upstream sodos_h5 {
    server sodos_h5:80;
}

upstream sodos_app {
    server sodos_app:80;
}

upstream auth_api {
    server auth-server:9501;
}

upstream sodos_docs {
    server sodos-docs:80;
}

