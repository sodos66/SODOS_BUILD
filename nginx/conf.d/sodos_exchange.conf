# Simple helper to set common proxy headers
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# -----------------------------------------------------------------------------
# API 域名（前台业务接口 + WebSocket）
# -----------------------------------------------------------------------------
server {
    listen 80;
    server_name api.sodos.cc;

    location / {
        proxy_pass http://sodos_exchange_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
    }

    location ~ /ws {
        proxy_pass http://sodos_exchange_ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# -----------------------------------------------------------------------------
# 管理端（通过容器 sodos_manager 提供界面与接口）
# -----------------------------------------------------------------------------
server {
    listen 80;
    server_name manager.sodos.cc;

    location ~* \.(?:js|css|png|jpg|jpeg|gif|svg|ico|woff2?|ttf|otf|eot)$ {
        proxy_pass http://sodos_manager_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        add_header Cache-Control "public, max-age=2592000";
        expires 30d;
    }

    location / {
        proxy_pass http://sodos_manager_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
    }
}

# -----------------------------------------------------------------------------
# H5 端（静态站点，支持缓存；接口同样回源）
